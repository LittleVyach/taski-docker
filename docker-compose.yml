volumes:
  pg_data:
  # Новый volume — для статических файлов
  static:

services:
  db:
    image: postgres:13.10
    restart: always
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    build: ./backend/
    restart: always
    env_file: .env
    # Тут подключаем volume к backend
    volumes:
      - static:/backend_static
  
  frontend:
    env_file: .env
    build: ./frontend/
    restart: always
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static

  gateway:
    build: ./gateway/
    restart: always
    env_file: .env
    volumes:
      - static:/staticfiles
    ports:
      - 8000:80 
